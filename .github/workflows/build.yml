name: Build all platforms

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: TechLife

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --project-name techlife --org com.techlife --platforms=android .
      - name: App name and internet permission
        run: |
          sed -i 's|android:label="[^"]*"|android:label="TechLife"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons-android.yaml
      - run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} --dart-define=ADMIN_HASH=${{ secrets.ADMIN_HASH }}
      - uses: actions/upload-artifact@v4
        with: { name: techlife-apk, path: build/app/outputs/flutter-apk/app-release.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --project-name techlife --org com.techlife --platforms=windows .
      - name: App name and icon
        shell: bash
        run: |
          sed -i 's/"techlife"/"TechLife"/g' windows/runner/main.cpp windows/runner/Runner.rc windows/CMakeLists.txt
          sed -i 's/L"techlife"/L"TechLife"/g' windows/runner/main.cpp
          sed -i 's/techlife\.exe/TechLife.exe/g' windows/runner/Runner.rc
          cp assets/icon/app_icon.ico windows/runner/resources/app_icon.ico
          grep -n "TechLife\|techlife" windows/CMakeLists.txt windows/runner/main.cpp windows/runner/Runner.rc || true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} --dart-define=ADMIN_HASH=${{ secrets.ADMIN_HASH }}
      - uses: actions/upload-artifact@v4
        with: { name: techlife-windows, path: build/windows/x64/runner/Release }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --project-name techlife --org com.techlife --platforms=web .
      - name: App name
        run: |
          sed -i 's/techlife/TechLife/g' web/index.html web/manifest.json
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons-web.yaml
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=ADMIN_HASH=${{ secrets.ADMIN_HASH }}
      - uses: actions/upload-artifact@v4
        with: { name: techlife-web, path: build/web }
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/web }

  deploy-pages:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --project-name techlife --org com.techlife --platforms=ios .
      - name: App name and photo permission
        run: |
          PL=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName TechLife" $PL
          /usr/libexec/PlistBuddy -c "Set :CFBundleName TechLife" $PL
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string TechLife uses your photos to set a wallpaper" $PL || true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons-ios.yaml
      - run: flutter build ios --release --no-codesign --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} --dart-define=ADMIN_HASH=${{ secrets.ADMIN_HASH }}
      - run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r techlife-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: techlife-ios-unsigned, path: techlife-unsigned.ipa }
